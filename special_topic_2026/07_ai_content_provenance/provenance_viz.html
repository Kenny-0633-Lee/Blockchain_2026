<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>콘텐츠 출처 증명 시각화 — 특강 시연 ⑦</title>
<style>
:root{--bg:#0f1b2d;--card:#17263d;--ink:#e8eef7;--dim:#8fa3bf;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5c04a;--ai:#4cc9f0;--line:#2a3d5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--dim);font-size:13px}
main{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:16px;padding:16px 22px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}button{background:#22365a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover{background:#2c4673}button.on{outline:2px solid var(--ai)}
canvas{width:100%;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);cursor:crosshair;display:block}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
code,pre{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}pre{margin:0;white-space:pre-wrap;word-break:break-all;color:#b8c7de}
.hash{font:13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}.d{color:var(--bad);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}.chk b{width:18px;text-align:center}.ok{color:var(--ok)}.no{color:var(--bad)}.na{color:var(--dim)}
.badge{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px}
.b-ok{background:#12392b;color:var(--ok)}.b-ai{background:#0f3342;color:var(--ai)}.b-fail{background:#4a1d1d;color:var(--bad)}.b-none{background:#4a3b13;color:var(--warn)}
.chain{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.blk{min-width:130px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#12203a;font-size:12px}
.blk.hit{border-color:var(--ai)}.blk.badl{border-color:var(--bad)}
.right{display:grid;gap:16px}
</style></head><body>
<header><h1>딥페이크 시대의 출처 증명 — 서명 · 해시 체인 · 블록체인 앵커</h1>
<p>시나리오 버튼을 누르고, 사진의 <b>픽셀을 클릭</b>해 1개만 바꿔 보세요. 해시와 판정이 즉시 달라집니다. (C2PA 방식의 개념 시뮬레이션)</p></header>
<main>
<section class="card"><h2>① 시나리오 선택</h2>
<div class="btns" id="btns"></div>
<div style="height:10px"></div><canvas id="cv" width="32" height="20"></canvas>
<div class="hint" id="hint">픽셀을 클릭하면 파란 값의 비트 1개가 뒤집힙니다.</div>
<div style="height:10px"></div>
<button id="anch">⛓ 촬영 매니페스트 해시를 블록체인에 앵커링</button>
<button id="rst">↺ 초기화</button>
</section>
<section class="right">
<div class="card"><h2>② 사진 해시 (SHA-256) — 지금 화면의 픽셀로 계산</h2>
<div class="hash" id="hnow"></div><div class="hash" style="color:var(--dim)" id="hsig"></div>
<div class="hint" id="hdiff"></div></div>
<div class="card"><h2>③ 검증 결과</h2><div id="checks"></div><div id="badge"></div><div class="hint" id="why"></div></div>
<div class="card"><h2>④ 매니페스트 (서명된 이력)</h2><pre id="mf"></pre></div>
<div class="card"><h2>⑤ 블록체인 앵커 (해시만 기록)</h2><div class="chain" id="chain"></div><div class="hint" id="anote"></div></div>
</section></main>
<script>
"use strict";
const W=32,H=20,enc=new TextEncoder();
/* ── 동기식 SHA-256 (화면 갱신용) ── */
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){const l=bytes.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(bytes);b[l]=0x80;
 const dv=new DataView(b.buffer);dv.setUint32(n-8,Math.floor(l*8/4294967296));dv.setUint32(n-4,(l*8)>>>0);
 let h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);const w=new Uint32Array(64);
 const R=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let [a,b2,c,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
  h[0]+=a;h[1]+=b2;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh}
 return [...h].map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const sha=s=>sha256(typeof s==="string"?enc.encode(s):s);
const hex2b=h=>Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
/* ── 사진 ── */
function photo(v){const a=new Uint8Array(W*H*3);let i=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c;
  if(v==="real"){const sun=(x-22)**2+(y-5)**2<=9;
   if(sun)c=[255,214,90];else if(y<11-((x>6&&x<15)?3:0)-(x>24?2:0))c=[90+y*6,140+y*5,230-y*3];else if(y<14)c=[60,110+(x%3)*8,70];else c=[40,90+(y-14)*12,170]}
  else{const sun=(x-8)**2+(y-6)**2<=14;if(sun)c=[255,90,70];else if(y<12)c=[200-y*6,90+y*4,120+y*5];else c=[70,60+(x%4)*10,90]}
  for(let k=0;k<3;k++)a[i++]=Math.max(0,Math.min(255,c[k]))}
 return a}
const bright=a=>a.map(v=>Math.min(255,v+24));
/* ── 키 · 서명 (WebCrypto ECDSA P-256, 안 되면 표시만) ── */
const subtle=(window.crypto&&crypto.subtle)||null;let cryptoOK=!!subtle;
const keys={};
async function mk(id,name){keys[id]={name,kid:sha(name).slice(0,12)};
 if(!cryptoOK)return;try{const kp=await subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);keys[id].kp=kp}catch(e){cryptoOK=false}}
const canon=m=>JSON.stringify(Object.fromEntries(Object.entries(m).sort()));
async function sign(id,m){if(!cryptoOK)return{id,sig:null};try{const s=await subtle.sign({name:"ECDSA",hash:"SHA-256"},keys[id].kp.privateKey,enc.encode(canon(m)));return{id,sig:new Uint8Array(s)}}catch(e){cryptoOK=false;return{id,sig:null}}}
async function sigOK(pkg){if(!pkg.sig)return cryptoOK?false:null;try{return await subtle.verify({name:"ECDSA",hash:"SHA-256"},keys[pkg.id].kp.publicKey,pkg.sig,enc.encode(canon(pkg.m)))}catch(e){return null}}
let trust=new Set(),store={},ledger=[],S={};
const mh=m=>sha(canon(m));
async function pack(id,asset,creator,action,parent){const m={asset_sha256:sha(asset),creator,action,parent:parent||null,signer:keys[id].kid};const s=await sign(id,m);return{m,id,sig:s.sig}}
function ledgerReset(){ledger=[{h:0,prev:"0".repeat(64),txs:["genesis"]}];for(const t of [["tx:other-1"],["tx:other-2"]])addBlock(t)}
const bh=b=>sha(`${b.h}|${b.prev}|${b.txs.join(",")}`);
function addBlock(t){const p=bh(ledger[ledger.length-1]);ledger.push({h:ledger.length,prev:p,txs:t})}
async function init(){
 await mk("cam","보도사진 카메라");await mk("desk","편집부 데스크");await mk("ai","정직한 AI 도구");await mk("evil","공격자");
 trust=new Set([keys.cam.kid,keys.desk.kid,keys.ai.kid]);store={};ledgerReset();
 const real=photo("real"),fake=photo("fake"),ed=bright(real);
 const p0=await pack("cam",real,"김기자 · 서울","captured");const h0=mh(p0.m);store[h0]=p0;
 const p1=await pack("desk",ed,"편집부 데스크","edited:brightness+24",h0);store[mh(p1.m)]=p1;
 const pf=await pack("evil",fake,"로이터 통신 · 현장 속보","captured");store[mh(pf.m)]=pf;
 const pa=await pack("ai",fake,"ImageGen 도구","ai-generated");store[mh(pa.m)]=pa;
 S={h0,sc:{
  orig:{t:"촬영 원본",px:real,pkg:p0,note:"카메라가 서명한 원본."},
  edit:{t:"정상 편집본",px:ed,pkg:p1,note:"밝기만 보정. 이력이 원본 매니페스트를 가리킴."},
  fake:{t:"딥페이크 (무서명)",px:fake,pkg:null,note:"서명 정보가 없음 → '가짜'가 아니라 '출처 없음'."},
  forge:{t:"위조 매니페스트",px:fake,pkg:pf,note:"공격자 키로 서명, 작성자를 '로이터'로 사칭. 서명은 유효하나 키가 신뢰 목록에 없음."},
  ai:{t:"선언된 AI 생성",px:fake,pkg:pa,note:"AI 도구가 스스로 'ai-generated'로 서명. 검증은 통과하되 'AI 생성'으로 표시."},
  strip:{t:"메타데이터 제거",px:real,pkg:null,note:"스크린샷·재인코딩으로 서명 정보를 지운 경우. 원본이어도 '출처 없음'."}}};
 pick("orig")}
let cur="orig",px,base;
function pick(k){cur=k;const s=S.sc[k];px=Uint8Array.from(s.px);base=sha(px);
 document.querySelectorAll("#btns button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()}
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function draw(){const im=ctx.createImageData(W,H);for(let i=0;i<W*H;i++){im.data[i*4]=px[i*3];im.data[i*4+1]=px[i*3+1];im.data[i*4+2]=px[i*3+2];im.data[i*4+3]=255}ctx.putImageData(im,0,0)}
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
 px[(y*W+x)*3+2]^=1;document.getElementById("hint").textContent=`픽셀 (${x},${y}) 의 파란 값 비트 1개를 바꿨습니다. 눈으로는 구별할 수 없습니다.`;render()});
function diffHex(a,b){let o="";for(let i=0;i<a.length;i++)o+=a[i]===b[i]?a[i]:`<span class="d">${a[i]}</span>`;return o}
function bits(a,b){let n=0;for(let i=0;i<a.length;i++){let x=parseInt(a[i],16)^parseInt(b[i],16);while(x){n+=x&1;x>>=1}}return n}
let rid=0;
async function render(){const my=++rid;draw();const s=S.sc[cur],now=sha(px),pkg=s.pkg;
 document.getElementById("hnow").innerHTML="지금: "+(now===base?now:diffHex(now,base));
 document.getElementById("hsig").textContent=pkg?"서명된 해시: "+pkg.m.asset_sha256:"서명된 해시: (없음)";
 document.getElementById("hdiff").textContent=now===base?"원본과 동일":`원본 대비 달라진 비트 ${bits(now,base)} / 256 (눈사태 효과)`;
 document.getElementById("mf").textContent=pkg?JSON.stringify(pkg.m,null,1)+"\n서명(ECDSA P-256): "+(pkg.sig?[...pkg.sig].slice(0,24).map(b=>b.toString(16).padStart(2,"0")).join("")+"…":"(이 브라우저에서 WebCrypto 사용 불가)"):"(매니페스트 없음)";
 const rows=[],mk=(n,v)=>rows.push([n,v]);let kind="none",txt="출처 없음 (서명 정보 없음)",why=s.note;
 if(pkg){mk("사진 해시 = 매니페스트의 해시",now===pkg.m.asset_sha256);const sv=await sigOK(pkg);mk("서명 유효 (공개키로 검증)",sv);
  mk("서명자가 신뢰 목록에 있음",trust.has(pkg.m.signer));
  let ok=true,p=pkg.m.parent;while(p){const q=store[p];if(!q||!trust.has(q.m.signer)){ok=false;break}p=q.m.parent}mk("편집 이력 체인이 끊기지 않음",ok);
  const all=rows.every(r=>r[1]!==false);kind=all?(pkg.m.action.startsWith("ai-")?"ai":"ok"):"fail";
  txt=all?(kind==="ai"?"검증됨 · 'AI 생성' 표시":"검증됨 · 출처 확인"):"검증 실패";
  if(now!==pkg.m.asset_sha256)why="사진이 바뀌어 해시가 달라졌다. 서명이 깨진 것이 아니라 '서명된 해시'와 '지금 사진의 해시'가 어긋난 것."}
 if(my!==rid)return;
 document.getElementById("checks").innerHTML=rows.length?rows.map(([n,v])=>`<div class="chk"><b class="${v===true?"ok":v===false?"no":"na"}">${v===true?"✔":v===false?"✘":"–"}</b>${n}${v===null?" (검증 불가)":""}</div>`).join(""):'<div class="chk na">검증할 서명 정보가 없습니다.</div>';
 document.getElementById("badge").innerHTML=`<span class="badge b-${kind}">● ${txt}</span>`;document.getElementById("why").textContent=why;
 renderChain()}
function renderChain(){const h=S.h0;let intact=true;
 document.getElementById("chain").innerHTML=ledger.map((b,i)=>{const bad=i>0&&b.prev!==bh(ledger[i-1]);if(bad)intact=false;
  return `<div class="blk ${b.txs.includes(h)?"hit":""} ${bad?"badl":""}"><b>블록 #${b.h}</b><br>${b.txs.map(t=>t.length>20?t.slice(0,12)+"…":t).join("<br>")}<br><span style="color:var(--dim)">prev ${b.prev.slice(0,8)}</span></div>`}).join("");
 const f=ledger.find(b=>b.txs.includes(h));
 document.getElementById("anote").textContent=!intact?"⚠ 장부가 변조되어 해시 체인이 어긋났습니다.":f?`촬영 매니페스트 해시가 블록 #${f.h} 에 기록됨 → 그 시점에 이미 존재했음을 누구나 확인 (사진 자체는 저장하지 않음).`:"아직 앵커링하지 않았습니다. 버튼을 눌러 보세요."}
document.getElementById("anch").onclick=()=>{if(!ledger.some(b=>b.txs.includes(S.h0))){addBlock([S.h0]);addBlock(["tx:other-3"])}renderChain()};
document.getElementById("rst").onclick=()=>{ledgerReset();pick(cur)};
const names=[["orig","① 촬영 원본"],["edit","② 정상 편집본"],["fake","③ 딥페이크(무서명)"],["forge","④ 위조 매니페스트"],["ai","⑤ 선언된 AI 생성"],["strip","⑥ 메타데이터 제거"]];
document.getElementById("btns").innerHTML=names.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("");
document.getElementById("btns").addEventListener("click",e=>{if(e.target.dataset.k)pick(e.target.dataset.k)});
init();
</script></body></html>
